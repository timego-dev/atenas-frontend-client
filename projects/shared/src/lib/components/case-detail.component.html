<div class="flex flex-col gap-2">
  <p-toolbar>
    <p-button label="Resolver" />
  </p-toolbar>
  <div class="flex flex-row gap-2">
    <p-panel class="flex-1" header="Consulta">
      <div class="flex flex-row gap-6">
        <div class="mr-auto"><strong>Referencia</strong></div>
        <div>
          {{ case().trackingNumber }}
        </div>
      </div>
      <div class="flex flex-row gap-6">
        <div class="mr-auto text-nowrap"><strong>Fecha entrada</strong></div>
        <div class="text-nowrap">
          <lib-date-time [dateTime]="case().creationDate" />
        </div>
      </div>
      <div class="flex flex-row gap-6">
        <div class="mr-auto"><strong>Emisor</strong></div>
        <div>
          {{ case().creator.username }}
        </div>
      </div>
    </p-panel>
    <p-panel class="flex-1" header="Respuesta">
      <div class="flex flex-row gap-6">
        <div class="mr-auto text-nowrap"><strong>Fecha respuesta</strong></div>
        <div class="text-nowrap">
          <lib-date-time [dateTime]="case().lastResolution" />
        </div>
      </div>
      <div class="flex flex-row gap-6">
        <div class="mr-auto"><strong>Experto</strong></div>
        <div>
          {{ case().expert?.username }}
        </div>
      </div>
      <div class="flex flex-row gap-6">
        <div class="mr-auto"><strong>Estado</strong></div>
        <div>
          <lib-estado-consulta [consulta]="case()" />
        </div>
      </div>
    </p-panel>
    <p-panel class="flex" header="Tiempo respuesta">
      <h1 class="text-right !text-green-500">2' 14"</h1>
    </p-panel>
  </div>

  <p-tabs value="0">
    <p-tablist>
      <p-tab value="0">Actividad</p-tab>
      @if (case().alerts?.length) {
      <p-tab value="1"
        >Alertas <p-badge severity="danger" [value]="case().alerts?.length" />
      </p-tab>
      }
      <p-tab value="2">Casos relacionados <p-badge value="2" /></p-tab>
    </p-tablist>
    <p-tabpanels>
      <p-tabpanel value="0">
        <case-activity-list [case]="case()" />
      </p-tabpanel>
      @if (case().alerts?.length) {
      <p-tabpanel value="1">
        <case-alerts-list [case]="case()" />
      </p-tabpanel>
      }
      <p-tabpanel value="2"> </p-tabpanel>
    </p-tabpanels>
  </p-tabs>
</div>
