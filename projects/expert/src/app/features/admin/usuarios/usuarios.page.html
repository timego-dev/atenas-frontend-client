<p-table
  #dt
  [value]="usuarios()"
  [rows]="10"
  [columns]="cols"
  [paginator]="true"
  [globalFilterFields]="['username', 'email']"
  [rowHover]="false"
  dataKey="id"
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} usuarios"
  [showCurrentPageReport]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
>
  <ng-template #caption>
    <nav class="flex">
      <div class="mr-auto">
        <h2 class="!m-0">Usuarios</h2>
      </div>

      <div class="flex flex-row gap-3">
        <p-button label="Añadir" icon="pi pi-plus" severity="primary" (onClick)="openNew()" />

        <p-iconfield>
          <p-inputicon class="pi pi-search" />
          <input
            pInputText
            type="text"
            (input)="onGlobalFilter(dt, $event)"
            placeholder="Buscar..."
          />
        </p-iconfield>
      </div>
    </nav>
  </ng-template>

  <ng-template #header>
    <tr>
      <th>Nombre</th>
      <th class="min-w-md">eMail</th>
      <th>Rol</th>
      <th>Estado</th>
    </tr>
  </ng-template>

  <ng-template #body let-usuario>
    <tr>
      <td>
        <button (click)="editUser(usuario)" class="p-button p-button-text">
          {{ usuario.username }}
        </button>
      </td>
      <td>{{ usuario.email }}</td>
      <td>
        <p-tag [value]="nombreRol(usuario.role)" [severity]="getRolColor(usuario.role)" />
      </td>
      <td>
        <p-tag
          [value]="usuario.locked ? 'Bloqueado' : 'Activo'"
          [severity]="getStatusColor(usuario.locked)"
        />
      </td>
    </tr>
  </ng-template>
</p-table>

<p-dialog [(visible)]="editDialog" [style]="{ width: '450px' }" header="Usuario" [modal]="true">
  <ng-template #content>
    <edit-usuario #editDialogComponent [usuario]="usuario" [submitted]="submitted" />
  </ng-template>

  <ng-template #footer>
    @if (usuario.id) {
    <p-button
      severity="danger"
      label="Eliminar"
      icon="pi pi-trash"
      outlined
      (onClick)="deleteUser(usuario)"
    />
    }

    <p-button severity="secondary" label="Cancelar" icon="pi pi-times" (click)="hideDialog()" />
    <p-button label="Guardar" icon="pi pi-check" (click)="guardar()" />
  </ng-template>
</p-dialog>

<p-confirmdialog />
