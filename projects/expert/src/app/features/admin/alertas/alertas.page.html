<p-table
  #dt
  [value]="alertas()"
  [rows]="10"
  [columns]="cols"
  [paginator]="true"
  [globalFilterFields]="['name', 'category', 'active', 'lastModifiedAt']"
  [rowHover]="false"
  dataKey="id"
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} alertas"
  [showCurrentPageReport]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
>
  <!-- HEADER TOOLBAR -->
  <ng-template #caption>
    <nav class="flex">
      <div class="mr-auto">
        <h2 class="!m-0">Alertas</h2>
      </div>

      <div class="flex flex-row gap-3">
        <p-button label="Añadir" icon="pi pi-plus" severity="primary" (onClick)="openNew()" />

        <p-iconfield>
          <p-inputicon styleClass="pi pi-search" />
          <input pInputText type="text" (input)="onGlobalFilter($event)" placeholder="Buscar..." />
        </p-iconfield>
      </div>
    </nav>
  </ng-template>

  <!-- TABLE HEADER -->
  <ng-template #header>
    <tr>
      <th>Alias</th>
      <th>Categoría</th>
      <th>Activo</th>
      <th>Última modificación</th>
    </tr>
  </ng-template>

  <!-- TABLE BODY -->
  <ng-template #body let-alerta>
    <tr>
      <td>
        <button (click)="editAlerta(alerta)" class="p-button p-button-text">
          {{ alerta.name }}
        </button>
      </td>

      <td>{{ alerta.category }}</td>

      <td>
        @if (alerta.active) {
        <p-button icon="pi pi-check" severity="success" class="pointer-events-none" />
        } @else {
        <p-button icon="pi pi-times" severity="danger" class="pointer-events-none" />
        }
      </td>

      <td>{{ alerta.lastModifiedAt | date : 'dd/MM/yyyy HH:mm' }}</td>
    </tr>
  </ng-template>
</p-table>

<!-- DIALOG -->
<p-dialog [(visible)]="editDialog" [style]="{ width: '50vw' }" header="Alerta" [modal]="true">
  <ng-template #content>
    <!-- Put your edit component here when available -->
    <edit-alertas [alert]="editingAlerta" [submitted]="submitted"></edit-alertas>
  </ng-template>

  <ng-template #footer>
    @if (selectedAlerta) {
    <p-button
      severity="danger"
      label="Eliminar"
      icon="pi pi-trash"
      outlined
      (onClick)="deleteAlerta(selectedAlerta)"
    />
    }
    <p-button
      severity="secondary"
      label="Cancelar"
      icon="pi pi-times"
      (click)="editDialog = false"
    />
    <p-button label="Guardar" icon="pi pi-check" (click)="guardar()" />
  </ng-template>
</p-dialog>

<p-confirmdialog></p-confirmdialog>
<p-toast></p-toast>
