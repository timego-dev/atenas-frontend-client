<p-table
  #dt
  [value]="caseList"
  [rows]="10"
  [columns]="cols"
  [paginator]="true"
  [rowHover]="false"
  [globalFilterFields]="['creator.username', 'operador']"
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} consultas"
  [showCurrentPageReport]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
>
  <ng-template #caption>
    <nav style="display: flex; align-items: center">
      <div style="margin-right: auto">
        <h2 style="margin: 0">Consultas</h2>
      </div>

      <div style="display: flex; flex-direction: row; gap: 1rem">
        <p-button
          label="Añadir"
          icon="pi pi-plus"
          severity="primary"
          (onClick)="clickCaseCreate()"
        />

        <p-multiselect
          placeholder="Estado"
          [options]="caseStatusAvailables"
          [(ngModel)]="caseFilter.status"
          filter="false"
          showClear="true"
          (onChange)="filterChange($event)"
        ></p-multiselect>

        <p-multiselect
          placeholder="Respuesta"
          [options]="caseResolutionAvailables"
          [(ngModel)]="caseFilter.response"
          filter="false"
          showClear="true"
          (onChange)="filterChange($event)"
        ></p-multiselect>

        <p-select
          showClear="true"
          placeholder="Periodo"
          [options]="periodos"
          [(ngModel)]="caseFilter.period"
          (onChange)="filterChange($event)"
        ></p-select>

        <p-iconfield>
          <p-inputicon class="pi pi-search" />
          <input
            pInputText
            type="text"
            placeholder="Buscar..."
            (input)="onGlobalFilter(dt, $event)"
          />
        </p-iconfield>
      </div>
    </nav>
  </ng-template>

  <ng-template #header>
    <tr>
      <th style="min-width: 4rem">Referencia</th>
      <th style="min-width: 8rem">Entrada</th>
      <th style="min-width: 8rem">Origen</th>
      <th style="min-width: 8rem">Tiempo respuesta</th>
      <th style="min-width: 8rem">Operador</th>
      <th style="min-width: 10rem">Estado</th>
    </tr>
  </ng-template>
  <ng-template #body let-consulta>
    <tr>
      <td style="min-width: 12rem">
        <button (click)="clickCaseDetail(consulta)" class="p-button p-button-text">
          {{ consulta.trackingNumber }}
        </button>
      </td>
      <td><lib-tiempo-entrada [consulta]="consulta" /></td>
      <td>{{ consulta.creator.username }}</td>
      <td><lib-tiempo-respuesta [consulta]="consulta" /></td>
      <td>{{ consulta.expert?.username }}</td>
      <td><lib-estado-consulta [consulta]="consulta" /></td>
    </tr>
  </ng-template>
</p-table>

<p-dialog
  [style]="{ width: '900px', height: '800px' }"
  #editDialogComponent
  [(visible)]="editDialog"
  [modal]="true"
>
  <ng-template #header>
    <div class="flex flex-row gap-4 mr-auto items-center">
      <h4 class="!m-0 inline">Consulta {{ case?.trackingNumber }}</h4>
      <lib-estado-consulta [consulta]="case!" />
    </div>
  </ng-template>

  <ng-template #content>
    <case-detail [case]="case!" />
  </ng-template>
</p-dialog>

<p-dialog
  #createDialogComponent
  [(visible)]="createCaseDialog"
  header="Nueva consulta"
  [modal]="true"
>
  <ng-template #content>
    <case-create [athenasMessage]="athenasMessage" />
  </ng-template>

  <ng-template #footer>
    <p-button severity="secondary" label="Cancelar" icon="pi pi-times" (click)="hideDialog()" />
    <p-button label="Guardar" icon="pi pi-check" (click)="saveCreate()" />
  </ng-template>
</p-dialog>
