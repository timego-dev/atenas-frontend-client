<!-- Dialog: Conexión perdida -->
<p-dialog
  [(visible)]="displayConnectionLostDialog"
  [modal]="true"
  [closable]="true"
  [dismissableMask]="false"
  [style]="{ width: '420px' }"
  [draggable]="false"
  [resizable]="false"
  header="{{ 'signalr.title' | translate }}"
  styleClass="border-round-lg shadow-3"
>
  <div class="text-center py-3 px-2">
    <p class="text-700 mb-0">
      {{ "signalr.connection-lost" | translate }}
    </p>
  </div>

  <ng-template pTemplate="footer">
    <div class="flex justify-content-end gap-2 p-2">
      <button
        pButton
        type="button"
        [label]="'common.buttons.reset' | translate"
        severity="primary"
        size="large"
        (click)="onClickReconnect()"
        class="w-auto"
      ></button>

      <button
        pButton
        type="button"
        [label]="'common.buttons.close' | translate"
        severity="danger"
        size="large"
        (click)="onClickClose()"
        class="w-auto"
      ></button>
    </div>
  </ng-template>
</p-dialog>

<!-- Dialog: Reintentando conexión -->
<p-dialog
  [(visible)]="displayReconnectingDialog"
  [modal]="true"
  [closable]="false"
  [dismissableMask]="false"
  [style]="{ width: '420px' }"
  [draggable]="false"
  [resizable]="false"
  header="{{ 'signalr.title' | translate }}"
  styleClass="border-round-lg shadow-3"
>
  <div
    class="flex flex-column align-items-center justify-content-center text-center py-4"
  >
    <p class="text-700 mb-3">
      {{ "signalr.reconnecting" | translate }}
    </p>
    <p-progressSpinner
      styleClass="mt-2"
      [style]="{ width: '40px', height: '40px' }"
      strokeWidth="4"
    ></p-progressSpinner>
  </div>
</p-dialog>

<!-- Dialog: Conectando -->
<p-dialog
  [(visible)]="displayConnectingDialog"
  [modal]="true"
  [closable]="false"
  [dismissableMask]="false"
  [style]="{ width: '420px' }"
  [draggable]="false"
  [resizable]="false"
  header="{{ 'signalr.title' | translate }}"
  styleClass="border-round-lg shadow-3"
>
  <div
    class="flex flex-column align-items-center justify-content-center text-center py-4"
  >
    <p class="text-700 mb-3">
      {{ "signalr.connecting" | translate }}
    </p>
    <p-progressSpinner
      styleClass="mt-2"
      [style]="{ width: '40px', height: '40px' }"
      strokeWidth="4"
    ></p-progressSpinner>
  </div>
</p-dialog>
