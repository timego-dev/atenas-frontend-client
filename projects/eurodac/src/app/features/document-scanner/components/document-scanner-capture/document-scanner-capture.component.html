<!-- Solo se muestra si NO hay problemas de conexión -->
<p-card *ngIf="!isConnectionBlocking()" styleClass="w-full max-w-xl">
  <ng-template pTemplate="content">
    <div class="p-6 text-center">
      <h2 class="text-xl font-semibold leading-relaxed mb-4">
        {{ textInstruccions() }}
      </h2>
    </div>
  </ng-template>

  <ng-template pTemplate="footer">
    <div class="flex flex-col md:flex-row md:justify-end gap-3 w-full">
      <p-button
        [label]="'common.buttons.leave' | translate"
        icon="pi pi-sign-out"
        iconPos="right"
        severity="danger"
        size="large"
        (onClick)="handleLeaveClick()"
        styleClass="w-full md:w-auto"
      ></p-button>

      <p-button
        [label]="'common.buttons.capture' | translate"
        icon="pi pi-arrow-right"
        iconPos="right"
        severity="primary"
        size="large"
        [disabled]="!isCaptureEnabled()"
        (onClick)="handleContinue()"
        styleClass="w-full md:w-auto"
      ></p-button>
    </div>
  </ng-template>
</p-card>

<app-connection-card
  [onStatusChange]="onStatusChange"
  (onReconnectClicked)="reconnect()"
  (onReconnected)="reconnect()"
  (onLeave)="handleLeaveClick()"
  (blockingUiChange)="handleBlockingUiChange($event)"
></app-connection-card>
