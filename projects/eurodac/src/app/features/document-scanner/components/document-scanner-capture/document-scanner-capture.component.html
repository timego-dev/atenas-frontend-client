<p-dialog
  [(visible)]="visible"
  [header]="'document.title' | translate"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{
    width: '90vw',
    maxWidth: '600px',
    height: isReviewMode() ? '80vh' : 'auto'
  }"
  [contentStyle]="{ display: 'flex', 'flex-direction': 'column', height: '100%' }"
  (onHide)="handleLeaveClick()"
>
  @if (!isConnectionBlocking() && !isReviewMode()) {
  <span class="p-text-secondary block mb-8">{{ textInstruccions() }}</span>
  } @if (isReviewMode() && capturedData()) {
  <p-tabs value="images">
    <p-tablist>
      <p-tab value="images">{{ 'document.tabs.images' | translate }}</p-tab>
      <p-tab value="mrz">{{ 'document.tabs.mrz' | translate }}</p-tab>
      <p-tab value="verifications">{{ 'document.tabs.verifications' | translate }}</p-tab>
    </p-tablist>

    <p-tabpanels>
      <div style="max-height: 55vh; overflow-y: auto" class="p-3">
        <p-tabpanel value="images">
          <div class="flex justify-content-center">
            <app-document-images [images]="currentImages()" class="w-full"></app-document-images>
          </div>
        </p-tabpanel>

        <p-tabpanel value="mrz">
          <app-document-mrz [data]="currentMrz()"></app-document-mrz>
        </p-tabpanel>

        <p-tabpanel value="verifications">
          <app-document-scanner-verifications [verifications]="currentVerifications()">
          </app-document-scanner-verifications>
        </p-tabpanel>
      </div>
    </p-tabpanels>
  </p-tabs>
  }

  <app-connection-card
    [onStatusChange]="onStatusChange"
    (onReconnectClicked)="reconnect()"
    (onReconnected)="reconnect()"
    (onLeave)="handleLeaveClick()"
    (blockingUiChange)="handleBlockingUiChange($event)"
  >
  </app-connection-card>

  <ng-template pTemplate="footer">
    @if (!isReviewMode()) {
    <p-button
      [label]="'common.buttons.leave' | translate"
      icon="pi pi-times"
      severity="secondary"
      (onClick)="handleLeaveClick()"
    >
    </p-button>

    <p-button
      [label]="'common.buttons.capture' | translate"
      icon="pi pi-arrow-right"
      iconPos="right"
      severity="primary"
      [disabled]="!isCaptureEnabled()"
      (onClick)="handleContinue()"
    >
    </p-button>
    } @if (isReviewMode()) {
    <p-button
      [label]="'common.buttons.cancel' | translate"
      icon="pi pi-times"
      severity="secondary"
      (onClick)="cancelReview()"
    >
    </p-button>

    <p-button
      [label]="'common.buttons.confirm' | translate"
      icon="pi pi-check"
      severity="primary"
      (onClick)="confirmCapture()"
    >
    </p-button>
    }
  </ng-template>
</p-dialog>
