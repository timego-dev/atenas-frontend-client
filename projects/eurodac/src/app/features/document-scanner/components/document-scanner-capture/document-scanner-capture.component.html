<p-card
  styleClass="w-full max-w-30rem shadow-2 border-round-lg overflow-hidden"
>
  <ng-template pTemplate="content">
    <div class="p-5 text-center">
      <h2 class="text-2xl font-semibold text-800 mb-4 leading-relaxed">
        {{ textInstruccions() }}
      </h2>
    </div>
  </ng-template>

  <ng-template pTemplate="footer">
    <div
      class="flex flex-column md:flex-row w-full md:justify-content-end align-items-center p-4 border-top-1 surface-border surface-50"
    >
      <p-button
        [label]="'common.buttons.leave' | translate"
        icon="pi pi-sign-out"
        iconPos="right"
        severity="danger"
        size="large"
        (onClick)="handleLeaveClick()"
        styleClass="w-full md:w-12rem justify-content-center mb-3 md:mb-0 md:mr-4"
      ></p-button>

      <p-button
        [label]="'common.buttons.capture' | translate"
        icon="pi pi-arrow-right"
        iconPos="right"
        severity="primary"
        size="large"
        [disabled]="!isCaptureEnabled()"
        (onClick)="handleContinue()"
        styleClass="w-full md:w-12rem justify-content-center"
      ></p-button>
    </div>
  </ng-template>
</p-card>

<app-connection-modal
  [onStatusChange]="onStatusChange"
  (onReconnectClicked)="reconnect()"
  (onReconnected)="reconnect()"
  (onLeave)="handleLeaveClick()"
></app-connection-modal>
